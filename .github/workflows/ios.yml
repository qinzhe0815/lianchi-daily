name: iOS validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Algorithms and platform behavior
        run: npm test
      - name: Native atomic storage tests
        run: npm run test:native
      - name: Sync iOS resources
        run: npm run sync:ios
      - name: Check project
        run: npm run check:ios
      - name: Build iOS simulator app without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: lianchi-ios-simulator
          path: DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
